[project]
name = "firefly-studio-tts"
version = "1.0.0"
description = "Firefly Studio TTS/ASR Python dependencies"
requires-python = ">=3.11"
dependencies = [
    "piper-tts==1.7.0",
    "onnxruntime==1.29.0",
    "numpy==2.4.6",
    "transformers==5.16.1",
    "huggingface-hub==1.29.0",
    "tokenizers==0.23.1",
    "safetensors==0.8.0",
    "fsspec==2026.7.0",
    "g2pw==0.1.1",
    "sentence-stream==1.3.0",
    "typer==0.27.1",
    "rich==15.0.0",
    "click==8.5.0",
    "shellingham==1.5.4",
    "pathvalidate==3.3.1",
    "pyyaml==6.0.3",
    "regex==2026.7.19",
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "anyio==4.14.2",
    "h11==0.16.0",
    "idna==3.19",
    "certifi==2026.7.22",
    "packaging==26.3",
    "filelock==3.32.4",
    "flatbuffers==25.12.19",
    "protobuf==7.36.0",
    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "pygments==2.21.0",
    "typing-extensions==4.16.0",
    "unicode-rbnf==2.4.0",
    "annotated-doc==0.0.5",
    "hf-xet==1.6.0",
    "tqdm==4.70.0",
]

[project.optional-dependencies]
asr = [
    "faster-whisper>=1.0.0",
]

[tool.uv]
package = false
dev-dependencies = []

[tool.uv.sources]
# 使用默认的 PyPI 源

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
